project:
  type: website
  output-dir: docs
  resources: img
  render:
    - "*.qmd" # Render all .qmd files
    - "!ignored-dir/" # Ignore a specific directory
execute:
  cache: true
  freeze: auto 
  
website:
  title: "Junior Jumbong"
  site-url: https://Jumbong.github.io/
  # Chapitres en attente de leur séance de TD.
  # Pour ouvrir un chapitre, retirer sa ligne puis lancer quarto render --no-clean.
  draft-mode: gone
  drafts:
    #- 1A/VariablesAleaGen/varalegenerale.qmd # Chapitre 3
    - 1A/VariablesAleaContines/varaleacont.qmd # Chapitre 5
    - 1A/VecteursAleatoiresDiscrests/VectAleaDis.qmd # Chapitre 6
  favicon: "flavicon.jpeg"
  back-to-top-navigation: true
  navbar:
    logo: "flavicon.jpeg"
    left:
      - href: index.qmd
        text: Accueil
      - href: ensai1A.qmd
        text: Enseignement
      - href: publications.qmd
        text: Publications
      - href: risques-esg.qmd
        text: Risques ESG
      - href: finance.qmd
        text: Finance
      - href: about.qmd
        text: About
  page-footer:
    left: "Junior Jumbong"
    right:
      - text: "Towards Data Science"
        href: https://towardsdatascience.com/author/jumbongjunior1999/
      - text: "LinkedIn"
        href: https://www.linkedin.com/in/junior-jumbong-258330211/



lang: fr

format:
  html:
    page-layout: full
    code-fold: true
    code-summary: "Show the code"
    theme:
      light: flat
    css: [styles.css, editorial.css]
    toc: true
    toc-location: left
    toc-title: "Sommaire"
    df-print: kable    
  # ipynb: default
  # pdf: default
