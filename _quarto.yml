project:
  type: website
  output-dir: docs
  resources: img
  render:
    - "*.qmd" # Render all .qmd files
    - "!ignored-dir/" # Ignore a specific directory
execute:
  cache: true
  freeze: auto 
  
website:
  title: ""
  site-url: https://Jumbong.github.io/
  # Chapitres en attente de leur séance de TD.
  # Pour ouvrir un chapitre, retirer sa ligne puis lancer quarto render --no-clean.
  draft-mode: gone
  drafts:
    - 1A/VariablesAleaGen/varalegenerale.qmd # Chapitre 3
    - 1A/VariablesAleaDiscretes/varaleadis.qmd # Chapitre 4
    - 1A/VariablesAleaContines/varaleacont.qmd # Chapitre 5
    - 1A/VecteursAleatoiresDiscrests/VectAleaDis.qmd # Chapitre 6
  favicon: "flavicon.jpeg"
  back-to-top-navigation: true
  navbar:
    logo: "flavicon.jpeg"
    left:
      - href: index.qmd
        text: Accueil
      - text: ENSAI
        menu:
          - href: ensai1A.qmd
            text: TD Ensai 1A 
          #- href: index_gdr.qmd
          #  text: Gestion des risques bancaires
      - text: Autres
        # menu:
          # - href: index_stat.qmd
          #   text: Statistiques - Ensai 2A 
          # - href: index_gdr.qmd
          #   text: Gestion des risques bancaires
      - href: about.qmd
        text: À propos



format:
  html:
    page-layout: full
    code-fold: true
    code-summary: "Show the code"
    theme:
      light: flat
    css: styles.css
    toc: true
    toc-location: left
    toc-title: "Sommaire"
    df-print: kable    
